# Weekly access-hygiene scan.
#
# This is the orchestration layer the tool was designed for: main.py --json
# writes a machine-readable summary to stdout precisely so a scheduler can
# consume it. The scanner stays the engine; this file is only the scheduler
# and the notifier.
#
# Note what is deliberately ABSENT: there is no step that removes anyone's
# access. The brief is right that revocation must stay a human decision, so
# the automation is built up to the point of action and stops there.

name: weekly-scan

on:
  schedule:
    - cron: "0 8 * * 1"       # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Activity window in days"
        required: false
        default: "180"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The SQLite database is what makes re-runs idempotent and ETags useful.
      # Restoring it means week two revalidates with 304s instead of refetching.
      - name: Restore previous scan database
        uses: actions/cache@v4
        with:
          path: data/
          key: scanner-db-${{ github.run_id }}
          restore-keys: scanner-db-

      - name: Scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.SCANNER_PAT }}
          GITHUB_ORG: ${{ vars.SCANNER_ORG }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
        run: |
          python main.py --json > summary.json
          echo "suggestions=$(python -c 'import json;print(json.load(open("summary.json"))["suggestions_made"])')" >> "$GITHUB_OUTPUT"
          echo "open_advisories=$(python -c 'import json;print(json.load(open("summary.json"))["advisories_open"])')" >> "$GITHUB_OUTPUT"

      - name: Publish dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: |
            out/dashboard.html
            summary.json
          retention-days: 90

      # Only speak up when there is something to act on. A weekly "all clear"
      # that nobody reads is how alerting dies.
      - name: Notify
        if: steps.scan.outputs.suggestions != '0' || steps.scan.outputs.open_advisories != '0'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          s = json.load(open("summary.json"))
          lines = [
              f"*Access hygiene — {s['org']}*",
              f"{s['advisories_open']} open advisories · "
              f"{s['suggestions_made']} stale access grants · "
              f"{s['repos_scanned']} repos scanned",
          ]
          for i, t in enumerate(s.get("top_suggestions", [])[:5], 1):
              lines.append(
                  f"{i}. `{t['login']}` — {t['permission']} on {t['repo']} "
                  f"(risk {t['risk']:.2f})"
              )
          lines.append(f"<{os.environ['RUN_URL']}|Dashboard and full report>")
          lines.append("_Suggestions only. Nothing has been revoked._")

          hook = os.environ.get("SLACK_WEBHOOK")
          if not hook:
              print("\n".join(lines))
              raise SystemExit(0)

          urllib.request.urlopen(urllib.request.Request(
              hook,
              data=json.dumps({"text": "\n".join(lines)}).encode(),
              headers={"Content-Type": "application/json"},
          ))
          PY
